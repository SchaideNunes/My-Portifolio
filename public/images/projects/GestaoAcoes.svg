    <rect x="320" y="516" width="350" height="150" rx="12" fill="#fff"/>
    <rect x="320" y="516" width="6" height="150" fill="#d97706"/>
    <rect x="342" y="536" width="54" height="26" rx="13" fill="#fef3c7"/><text x="352" y="555" fill="#b45309" font-size="14" font-weight="600">Alta</text>
