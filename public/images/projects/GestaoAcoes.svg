    <text x="100" y="258" fill="#fff" font-weight="600">Minhas Ações</text>
    <text x="100" y="318">Todas as Ações</text>
    <text x="100" y="378">Indicadores</text>
    <text x="100" y="438">Histórico</text>
  </g>
  <!-- Header -->
  <text x="300" y="118" fill="#1f2a44" font-size="32" font-weight="700">Minhas Ações</text>
  <rect x="1180" y="86" width="320" height="46" rx="10" fill="#fff" stroke="#d7dbe3"/>
  <text x="1204" y="116" fill="#9aa3b2" font-size="17">Buscar ação…</text>
  <!-- KPI cards -->
  <g font-size="16">
    <rect x="300" y="160" width="290" height="96" rx="14" fill="#fff" stroke="#e3e6ec"/>
    <text x="324" y="196" fill="#6b7385">Em aberto</text><text x="324" y="236" fill="#1f2a44" font-size="32" font-weight="700">24</text>
    <rect x="610" y="160" width="290" height="96" rx="14" fill="#fff" stroke="#e3e6ec"/>
    <text x="634" y="196" fill="#6b7385">Atrasadas</text><text x="634" y="236" fill="#dc2626" font-size="32" font-weight="700">3</text>
    <rect x="920" y="160" width="290" height="96" rx="14" fill="#fff" stroke="#e3e6ec"/>
    <text x="944" y="196" fill="#6b7385">Vencendo em breve</text><text x="944" y="236" fill="#d97706" font-size="32" font-weight="700">5</text>
    <rect x="1230" y="160" width="270" height="96" rx="14" fill="#fff" stroke="#e3e6ec"/>
    <text x="1254" y="196" fill="#6b7385">Concluídas na semana</text><text x="1254" y="236" fill="#16a34a" font-size="32" font-weight="700">11</text>
  </g>
  <!-- Kanban columns -->
  <g font-size="18" font-weight="700" fill="#1f2a44">
