    <rect x="710" y="286" width="390" height="630" rx="16" fill="#e9ecf2"/>
    <text x="734" y="326">Tratando</text>
    <rect x="1120" y="286" width="380" height="630" rx="16" fill="#e9ecf2"/>
    <text x="1144" y="326">Finalizadas</text>
  </g>
  <!-- Card template helper: title bar, priority chip, deadline text -->
