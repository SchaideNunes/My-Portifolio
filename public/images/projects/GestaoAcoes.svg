    <rect x="320" y="350" width="350" height="150" rx="12" fill="#fff"/>
    <rect x="320" y="350" width="6" height="150" fill="#dc2626"/>
    <rect x="342" y="370" width="72" height="26" rx="13" fill="#fee2e2"/><text x="352" y="389" fill="#b91c1c" font-size="14" font-weight="600">Urgente</text>
    <rect x="342" y="412" width="290" height="14" rx="7" fill="#d4d9e2"/>
    <rect x="342" y="436" width="210" height="14" rx="7" fill="#e3e6ec"/>
