    <rect x="342" y="602" width="180" height="14" rx="7" fill="#e3e6ec"/>
    <text x="342" y="648" fill="#d97706" font-weight="600">Vence hoje</text>
    <rect x="320" y="682" width="350" height="150" rx="12" fill="#fff"/>
    <rect x="320" y="682" width="6" height="150" fill="#9aa3b2"/>
    <rect x="342" y="702" width="70" height="26" rx="13" fill="#e5e7eb"/><text x="352" y="721" fill="#4b5563" font-size="14" font-weight="600">Média</text>
    <rect x="342" y="744" width="250" height="14" rx="7" fill="#d4d9e2"/>
    <rect x="342" y="768" width="200" height="14" rx="7" fill="#e3e6ec"/>
    <text x="342" y="814" fill="#6b7385">Vence em 6 dias</text>
    <!-- Tratando -->
    <rect x="730" y="350" width="350" height="170" rx="12" fill="#fff"/>
    <rect x="730" y="350" width="6" height="170" fill="#d97706"/>
    <rect x="752" y="370" width="54" height="26" rx="13" fill="#fef3c7"/><text x="762" y="389" fill="#b45309" font-size="14" font-weight="600">Alta</text>
    <rect x="752" y="412" width="290" height="14" rx="7" fill="#d4d9e2"/>
    <rect x="752" y="436" width="230" height="14" rx="7" fill="#e3e6ec"/>
    <text x="752" y="482" fill="#6b7385">Vence em 2 dias</text>
    <rect x="752" y="494" width="116" height="16" rx="8" fill="#ede9fe"/><text x="760" y="507" fill="#6d28d9" font-size="12" font-weight="600">Aguardando aprovação</text>
    <rect x="730" y="536" width="350" height="150" rx="12" fill="#fff"/>
    <rect x="730" y="536" width="6" height="150" fill="#9aa3b2"/>
    <rect x="752" y="556" width="70" height="26" rx="13" fill="#e5e7eb"/><text x="762" y="575" fill="#4b5563" font-size="14" font-weight="600">Média</text>
    <rect x="752" y="598" width="260" height="14" rx="7" fill="#d4d9e2"/>
    <rect x="752" y="622" width="170" height="14" rx="7" fill="#e3e6ec"/>
    <text x="752" y="668" fill="#6b7385">Vence em 9 dias</text>
    <!-- Finalizadas -->
    <rect x="1140" y="350" width="340" height="130" rx="12" fill="#fff"/>
    <rect x="1140" y="350" width="6" height="130" fill="#16a34a"/>
    <rect x="1162" y="372" width="260" height="14" rx="7" fill="#d4d9e2"/>
    <rect x="1162" y="396" width="190" height="14" rx="7" fill="#e3e6ec"/>
    <text x="1162" y="456" fill="#16a34a" font-weight="600">✓ Concluída</text>
    <rect x="1140" y="496" width="340" height="130" rx="12" fill="#fff"/>
    <rect x="1140" y="496" width="6" height="130" fill="#16a34a"/>
    <rect x="1162" y="518" width="240" height="14" rx="7" fill="#d4d9e2"/>
    <rect x="1162" y="542" width="200" height="14" rx="7" fill="#e3e6ec"/>
    <text x="1162" y="602" fill="#16a34a" font-weight="600">✓ Concluída</text>
  </g>
</svg>
