<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1600" height="1000" fill="#0b0b0f"/>
  <rect x="60" y="50" width="1480" height="900" rx="22" fill="#f4f5f7"/>
  <!-- Sidebar -->
  <path d="M60 72a22 22 0 0 1 22-22h178v900H82a22 22 0 0 1-22-22z" fill="#1f2a44"/>
  <circle cx="110" cy="110" r="20" fill="#f59e0b"/>
  <text x="142" y="117" fill="#fff" font-size="20" font-weight="700">Ações</text>
  <g font-size="17" fill="#c7cfe0">
    <rect x="80" y="170" width="160" height="44" rx="10" fill="#2e3b5c"/>
